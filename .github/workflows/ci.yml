name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Vollständiger Report (alle Schweregrade) – rein informativ, bricht den
      # Build nicht ab. Nützlich, um die Code-Qualität schrittweise zu verbessern.
      - name: ShellCheck report (informativ)
        run: make lint || true

      # Build-relevante Prüfung: nur echte Fehler lassen die CI scheitern.
      - name: ShellCheck gate (severity=error)
        run: make lint-gate

  test:
    name: bats (CLI + Datei-Roundtrip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y bats netcat-openbsd

      # Blockgerät- und Remote-Tests überspringen sich hier mangels root/SSH
      # automatisch; sie laufen im dedizierten integration-Job.
      - name: Run test suite
        run: make test

  integration:
    name: bats (Blockgeräte + Remote)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y bats netcat-openbsd iproute2 openssh-server

      # Passwortlosen SSH-Zugang root@localhost einrichten (für die Remote-Tests).
      - name: Set up passwordless SSH to localhost (root)
        run: |
          sudo mkdir -p /run/sshd /root/.ssh
          sudo chmod 700 /root/.ssh
          sudo ssh-keygen -t ed25519 -N '' -f /root/.ssh/id_ed25519
          sudo bash -c 'cat /root/.ssh/id_ed25519.pub >> /root/.ssh/authorized_keys'
          sudo chmod 600 /root/.ssh/authorized_keys
          sudo bash -c 'printf "Host localhost\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n" >> /root/.ssh/config'
          sudo systemctl start ssh || sudo /usr/sbin/sshd
          sudo ssh -o BatchMode=yes -o ConnectTimeout=10 root@localhost 'echo SSH-OK; command -v ss nc dd'

      # losetup braucht root, ssh-zu-localhost ebenfalls als root -> via sudo.
      - name: Run integration tests (block devices + remote) as root
        run: sudo --preserve-env=PATH bats tests/blockdev.bats tests/remote.bats
