services:
  source:
    build: .
    image: ddpar-test
    container_name: ddpar-source
    hostname: source
    environment:
      DDPAR_ROLE: source
      TEST_SIZE_MB: ${TEST_SIZE_MB:-64}
      ROOT_PASSWORD: ${ROOT_PASSWORD:-}
    volumes:
      # Die ddpar-Skripte aus dem Repo-Root read-only einbinden
      - ../:/opt/ddpar:ro
      - source-pub:/run/ddpar-public
      - target-pub:/run/ddpar-peer:ro
    working_dir: /opt/ddpar
    networks:
      - ddpar
    # Fuer optionale Block-Device-Tests (losetup) entkommentieren:
    # privileged: true

  target:
    build: .
    image: ddpar-test
    container_name: ddpar-target
    hostname: target
    environment:
      DDPAR_ROLE: target
      ROOT_PASSWORD: ${ROOT_PASSWORD:-}
    volumes:
      - ../:/opt/ddpar:ro
      - target-pub:/run/ddpar-public
      - source-pub:/run/ddpar-peer:ro
    working_dir: /opt/ddpar
    networks:
      - ddpar
    # privileged: true

networks:
  ddpar:
    driver: bridge

volumes:
  source-pub:
  target-pub:
